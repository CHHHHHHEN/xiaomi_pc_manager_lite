[package]
name = "xiaomi-pc-manager-lite"
version = "1.0.0"
edition = "2021"
description = "Xiaomi PC Manager Lite - Battery care / Performance mode"
authors = ["opencode"]
license = "MIT"

[build-dependencies]
winres = "0.1"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
dirs = "6"
log = "0.4"
env_logger = "0.11"
libloading = "0.8"
rust-embed = "8"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Wmi",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
]}

# 发布构建优化（NFR-PERF-04，Could 级目标 ≤ 6 MB，修订 1.32/1.46）：
# - lto = "fat"：跨 crate 链接期优化（full 版比 thin 更激进，可补偿
#   panic 从 abort 改 unwind 带来的体积回增——见下）；
# - codegen-units = 1：单 codegen 单元最大化内联收益（与 LTO 配合）；
# - opt-level = "z"：极致优化体积；本应用是 IO/等待密集（WMI/托盘/热键），
#   无热计算路径，z 的尺寸收益没有性能代价；
# - strip = true：剥离符号表（调试信息单独由 PDB 承载，不影响可排查性）；
# - **不用** panic = "abort"：M4 设计（main.rs 后端初始化线程 catch_unwind
#   降级 NullBackend）要求 unwind 语义——abort 下 catch_unwind 是死代码，
#   release 构建后端 panic 会静默消失，与设计意图冲突（修订 1.32）。
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
